name = "orquestra"
account_id = "568525424c1d0ac88c8baa71f52d3e45"
workers_dev = true
main = "packages/worker/src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Development Variables (used by `wrangler dev` without --env flag)
[vars]
ENVIRONMENT = "development"
GITHUB_OAUTH_ID = "Ov23liMCsCr6TDxJdNy5"

JWT_EXPIRY = "30d"
FRONTEND_URL = "http://localhost:5173"
API_BASE_URL = "http://localhost:8787"
CORS_ORIGIN = "http://localhost:5173"

# Routes for production
[route]
pattern = "api.orquestra.dev/*"
zone_name = "orquestra.dev"

# Top-level D1 Databases (used by wrangler CLI commands)
[[d1_databases]]
binding = "DB"
database_name = "orquestra-prod"
database_id = "7308ceeb-9f86-4948-a1bf-916d21078788"

# Top-level KV Namespaces (used by wrangler CLI commands)
[[kv_namespaces]]
binding = "IDLS"
id = "f9bd92f54c1149fba41a7c6c3ef20760"

[[kv_namespaces]]
binding = "CACHE"
id = "00550acbdd544169b8af0e5eb7a34bdd"

[ai]
binding = "AI"

# 15 * * * * / 0 2 * * *  → candidates drain workflow
# 0 5 * * 6               → weekly full IDL sweep (recheck entire candidate pool)
# 45 * * * *              → pipeline health check + auto-remediation
[triggers]
crons = ["15 * * * *", "0 2 * * *", "0 5 * * 6", "45 * * * *"]

# Workflow: daily Solana Compass program metrics import (runs durably, one step per page)
[[workflows]]
name = "program-metrics-import"
binding = "PROGRAM_METRICS_WORKFLOW"
class_name = "ProgramMetricsWorkflow"
schedules = ["0 3 * * *"]

# Workflow: on-demand AI analysis (fetch project → gen docs → AI call → categorize)
[[workflows]]
name = "ai-analysis"
binding = "AI_ANALYSIS_WORKFLOW"
class_name = "AiAnalysisWorkflow"

# Workflow: durable IDL sync — replaces legacy runDailyIdlSync cron
[[workflows]]
name = "idl-sync"
binding = "IDL_SYNC_WORKFLOW"
class_name = "IdlSyncWorkflow"
schedules = ["0 */6 * * *"]

# Workflow: per-project cache update after IDL change (on-demand)
[[workflows]]
name = "idl-update-cache"
binding = "IDL_UPDATE_CACHE_WORKFLOW"
class_name = "IdlUpdateCacheWorkflow"

# Workflow: bulk categorize programs missing program_categories (on-demand)
[[workflows]]
name = "bulk-recategorize"
binding = "BULK_RECATEGORIZE_WORKFLOW"
class_name = "BulkRecategorizeWorkflow"

# Workflow: DEPRECATED monolith (match+import in one) — unscheduled, manual fallback only.
# Production path is the split chain: osec-discover → candidates-drain → verified-match → verified-analysis.
[[workflows]]
name = "verified-builds"
binding = "VERIFIED_BUILDS_WORKFLOW"
class_name = "VerifiedBuildsWorkflow"

# Workflow: generate AI analysis for verified programs that have IDL but no analysis yet
[[workflows]]
name = "verified-analysis"
binding = "VERIFIED_ANALYSIS_WORKFLOW"
class_name = "VerifiedAnalysisWorkflow"

# Workflow: discover verified programs from OSEC list and enqueue them as candidates
[[workflows]]
name = "osec-discover"
binding = "OSEC_DISCOVER_WORKFLOW"
class_name = "OsecDiscoverWorkflow"
schedules = ["0 1 * * *"]

# Workflow: match OSEC-verified programs against existing DB rows + trigger AI analysis
[[workflows]]
name = "verified-match"
binding = "VERIFIED_MATCH_WORKFLOW"
class_name = "VerifiedMatchWorkflow"
schedules = ["0 4 * * 1"]

# Workflow: fetch on-chain IDL (rate-limit-throttled) for OSEC-verified programs missing from DB or missing an IDL
[[workflows]]
name = "verified-idl-import"
binding = "VERIFIED_IDL_IMPORT_WORKFLOW"
class_name = "VerifiedIdlImportWorkflow"

# Workflow: durable candidate drain (hourly) + weekly full IDL sweep.
# Started from the scheduled() handler (crons 15 * * * *, 0 2 * * *, 0 5 * * 6)
# and self-continues in ~10k-candidate rounds. Replaces the old runCandidatesBurst.
[[workflows]]
name = "candidates-drain"
binding = "CANDIDATES_DRAIN_WORKFLOW"
class_name = "CandidatesDrainWorkflow"

# Environment: Production
[env.production]
name = "orquestra-worker-prod"
compatibility_flags = ["nodejs_compat"]
routes = [
  { pattern = "api.orquestra.dev/*", zone_name = "orquestra.dev" }
]

[[env.production.d1_databases]]
binding = "DB"
database_name = "orquestra-prod"
database_id = "7308ceeb-9f86-4948-a1bf-916d21078788"

[[env.production.kv_namespaces]]
binding = "IDLS"
id = "f9bd92f54c1149fba41a7c6c3ef20760"

[[env.production.kv_namespaces]]
binding = "CACHE"
id = "00550acbdd544169b8af0e5eb7a34bdd"

[env.production.ai]
binding = "AI"

[env.production.triggers]
crons = ["15 * * * *", "0 2 * * *", "0 5 * * 6", "45 * * * *"]

[[env.production.workflows]]
name = "program-metrics-import-prod"
binding = "PROGRAM_METRICS_WORKFLOW"
class_name = "ProgramMetricsWorkflow"
schedules = ["0 3 * * *"]

[[env.production.workflows]]
name = "ai-analysis-prod"
binding = "AI_ANALYSIS_WORKFLOW"
class_name = "AiAnalysisWorkflow"

[[env.production.workflows]]
name = "idl-sync-prod"
binding = "IDL_SYNC_WORKFLOW"
class_name = "IdlSyncWorkflow"
schedules = ["0 */6 * * *"]

[[env.production.workflows]]
name = "idl-update-cache-prod"
binding = "IDL_UPDATE_CACHE_WORKFLOW"
class_name = "IdlUpdateCacheWorkflow"

[[env.production.workflows]]
name = "bulk-recategorize-prod"
binding = "BULK_RECATEGORIZE_WORKFLOW"
class_name = "BulkRecategorizeWorkflow"

[[env.production.workflows]]
name = "verified-builds-prod"
binding = "VERIFIED_BUILDS_WORKFLOW"
class_name = "VerifiedBuildsWorkflow"

[[env.production.workflows]]
name = "verified-analysis-prod"
binding = "VERIFIED_ANALYSIS_WORKFLOW"
class_name = "VerifiedAnalysisWorkflow"

[[env.production.workflows]]
name = "osec-discover-prod"
binding = "OSEC_DISCOVER_WORKFLOW"
class_name = "OsecDiscoverWorkflow"
schedules = ["0 1 * * *"]

[[env.production.workflows]]
name = "verified-match-prod"
binding = "VERIFIED_MATCH_WORKFLOW"
class_name = "VerifiedMatchWorkflow"
schedules = ["0 4 * * 1"]

[[env.production.workflows]]
name = "verified-idl-import-prod"
binding = "VERIFIED_IDL_IMPORT_WORKFLOW"
class_name = "VerifiedIdlImportWorkflow"

[[env.production.workflows]]
name = "candidates-drain-prod"
binding = "CANDIDATES_DRAIN_WORKFLOW"
class_name = "CandidatesDrainWorkflow"

# Environment: Development
[env.development]
name = "orquestra-worker-dev"
workers_dev = true
compatibility_flags = ["nodejs_compat"]

[[env.development.d1_databases]]
binding = "DB"
database_name = "orquestra-dev"
database_id = "38a17d10-e419-44f9-834c-1cbf64d81d66"

[[env.development.kv_namespaces]]
binding = "IDLS"
id = "ab1db1fef1094ee89aa4b7876c1b7d38"

[[env.development.kv_namespaces]]
binding = "CACHE"
id = "5868c26cb04949fd88ff75c0d315d475"

[env.development.ai]
binding = "AI"

# Environment Variables - Production
[env.production.vars]
ENVIRONMENT = "production"
GITHUB_OAUTH_ID = "Ov23liMCsCr6TDxJdNy5"

JWT_EXPIRY = "7d"
FRONTEND_URL = "https://orquestra.dev"
API_BASE_URL = "https://api.orquestra.dev"
CORS_ORIGIN = "https://orquestra.dev"

# Environment Variables - Development
[env.development.vars]
ENVIRONMENT = "development"
GITHUB_OAUTH_ID = "Ov23liMCsCr6TDxJdNy5"

JWT_EXPIRY = "30d"
FRONTEND_URL = "http://localhost:5173"
API_BASE_URL = "http://localhost:8787"
CORS_ORIGIN = "http://localhost:5173"

# Secrets (set via: wrangler secret put <NAME>)
# Required secrets for production:
#   JWT_SECRET          — JWT signing secret
#   GITHUB_OAUTH_SECRET — GitHub OAuth app secret
#   INGEST_API_KEY      — Service key for CLI bulk IDL ingest (X-Ingest-Key header)
# Optional secrets for RPC failover:
#   SOLANA_MAINNET_FALLBACK_RPC_URLS — comma-separated backup mainnet RPC URLs
#   SOLANA_FALLBACK_RPC_URLS         — comma-separated generic backup RPC URLs
#
# Set with: wrangler secret put INGEST_API_KEY --env production

# Observability
[observability]
enabled = false
